<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusHub | Student Planner</title>
<style>
:root{--navy:#172554;--blue:#4f46e5;--bg:#f4f6fb;--ink:#172033;--muted:#68738a;--line:#e5e9f2;--green:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#172554,#4338ca);color:white;padding:26px max(20px,calc((100% - 1100px)/2));}
header h1{margin:0;font-size:27px}header p{margin:7px 0 0;color:#dbeafe}
main{max-width:1100px;margin:24px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.card,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px #1725540a}
.stat-label{font-size:13px;color:var(--muted)}.stat-value{font-size:27px;font-weight:750;margin-top:6px}
.layout{display:grid;grid-template-columns: minmax(260px, .85fr) 1.5fr;gap:18px}
h2{font-size:18px;margin:0 0 15px}.field{margin:12px 0}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d9deea;border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:72px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:white;width:100%}.secondary{background:#eef2ff;color:#3730a3}.danger{background:#fff1f2;color:#be123c;padding:7px 10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar button.active{background:var(--navy);color:white}
.task{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--green)}
.task-body{flex:1;min-width:0}.task-title{font-weight:700}.task.done .task-title{text-decoration:line-through;color:#8992a5}
.meta{font-size:12px;color:var(--muted);margin-top:5px}.pill{display:inline-block;padding:3px 8px;border-radius:30px;background:#eef2ff;color:#4338ca;font-size:11px;margin-right:5px}
.empty{text-align:center;padding:28px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
@media(max-width:720px){.layout{grid-template-columns:1fr}.stats{gap:8px}.card{padding:13px}.stat-value{font-size:22px}header{padding:22px 18px}}
</style>
</head>
<body>
<header><h1>CampusHub 🎓</h1><p>Your simple space to organize college tasks, deadlines and events.</p></header>
<main>
<section class="stats">
 <div class="card"><div class="stat-label">Total tasks</div><div class="stat-value" id="total">0</div></div>
 <div class="card"><div class="stat-label">Completed</div><div class="stat-value" id="completed">0</div></div>
 <div class="card"><div class="stat-label">Upcoming events</div><div class="stat-value" id="events">0</div></div>
</section>
<div class="layout">
 <section class="panel">
  <h2>Add a task or event</h2>
  <form id="itemForm">
   <div class="field"><label for="title">Title</label><input id="title" maxlength="80" placeholder="e.g. Submit EMFT assignment" required></div>
   <div class="field"><label for="type">Type</label><select id="type"><option value="Task">Task</option><option value="Event">Event</option></select></div>
   <div class="field"><label for="date">Date</label><input id="date" type="date" required></div>
   <div class="field"><label for="category">Category</label><select id="category"><option>Academics</option><option>Club</option><option>Personal</option><option>Project</option></select></div>
   <div class="field"><label for="notes">Notes (optional)</label><textarea id="notes" maxlength="220" placeholder="Add a short note..."></textarea></div>
   <button class="primary" type="submit">＋ Add to CampusHub</button>
  </form>
 </section>
 <section class="panel">
  <div class="section-head"><h2>Your planner</h2><span class="pill" id="count">0 items</span></div>
  <div class="toolbar">
   <button class="secondary active" data-filter="All">All</button>
   <button class="secondary" data-filter="Task">Tasks</button>
   <button class="secondary" data-filter="Event">Events</button>
   <button class="secondary" data-filter="Open">Pending</button>
  </div>
  <div id="items"></div>
 </section>
</div>
</main>
<footer>CampusHub · A student productivity project · Data stays in this browser</footer>
<script>
const $=id=>document.getElementById(id);
let items=JSON.parse(localStorage.getItem('campushub_items')||'[]'),filter='All';
const today=new Date().toISOString().slice(0,10);
$('date').value=today;
function save(){localStorage.setItem('campushub_items',JSON.stringify(items));render()}
function render(){
 const visible=items.filter(x=>filter==='All'||(filter==='Open'?!x.done:x.type===filter)).sort((a,b)=>a.date.localeCompare(b.date));
 $('total').textContent=items.filter(x=>x.type==='Task').length;
 $('completed').textContent=items.filter(x=>x.type==='Task'&&x.done).length;
 $('events').textContent=items.filter(x=>x.type==='Event'&&x.date>=today).length;
 $('count').textContent=visible.length+' items';
 $('items').innerHTML=visible.length?visible.map(x=>`<div class="task ${x.done?'done':''}">
 ${x.type==='Task'?`<input aria-label="Mark ${escapeHtml(x.title)} complete" type="checkbox" ${x.done?'checked':''} onchange="toggleItem('${x.id}')">`:'<span>📅</span>'}
 <div class="task-body"><div class="task-title">${escapeHtml(x.title)}</div><div class="meta"><span class="pill">${x.type}</span><span class="pill">${escapeHtml(x.category)}</span> ${formatDate(x.date)}</div>${x.notes?`<div class="meta">${escapeHtml(x.notes)}</div>`:''}</div>
 <button class="danger" onclick="deleteItem('${x.id}')">Delete</button></div>`).join(''):'<div class="empty">No items here yet. Add your first task or event!</div>';
 document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDate(s){return new Date(s+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
window.toggleItem=id=>{items=items.map(x=>x.id===id?{...x,done:!x.done}:x);save()};
window.deleteItem=id=>{items=items.filter(x=>x.id!==id);save()};
$('itemForm').addEventListener('submit',e=>{e.preventDefault();items.push({id:Date.now().toString(),title:$('title').value.trim(),type:$('type').value,date:$('date').value,category:$('category').value,notes:$('notes').value.trim(),done:false});e.target.reset();$('date').value=today;save()});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));
render();
</script>
</body>
</html>
